# Dev-time peer wiring for this standalone plugin.
#
# The @deepseek-ai/dsh-client-ui-* peers are not fully published: resolving
# them from the registry pulls @deepseek-ai/dsh-client-runtime, whose own
# dependencies (dsh-compact, dsh-session, ...) are private and fail the
# install.  Pin both UI peers to the local DeepSeek Harness checkout instead
# — the same packages the host provides at runtime.
overrides:
  "@deepseek-ai/dsh-client-ui-settings": "link:../deepseek-harness/packages/client/ui-settings"
  "@deepseek-ai/dsh-client-ui-primitives": "link:../deepseek-harness/packages/client/ui-primitives"
